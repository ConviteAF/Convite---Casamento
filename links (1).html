<!DOCTYPE html>
<html lang="pt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Gerador de links dos convites</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:1rem;background:#EEF1EC;color:#1F2A24}h1{color:#5A1A2B}textarea,input{width:100%;padding:.6rem;border:1px solid #bbb;border-radius:8px;font:inherit}button,a.b{display:inline-block;border:0;border-radius:999px;padding:.5rem 1rem;background:#9C7A3F;color:#fff;font:inherit;text-decoration:none;cursor:pointer;margin:.2rem .2rem 0 0}button.o{background:none;border:1.5px solid #9C7A3F;color:#7a5f2d}.r{background:#fff;border:1px solid #ccc;border-radius:10px;padding:.7rem;margin:.6rem 0;word-break:break-all}small{color:#555}</style></head>
<body>
<h1>Links dos convites</h1>
<p>Escreva <b>um convidado por linha</b>, no formato <code>nome;lugares;telefone</code>. Lugares e telefone são opcionais.<br><small>Exemplo: João e família;4;244923000000</small></p>
<textarea id="list" rows="8" placeholder="João e família;4;244923000000&#10;Maria Silva;2"></textarea>
<p><label for="base">Endereço do convite</label><input id="base"></p>
<button id="go">Gerar links</button> <button class="o" id="all">Copiar todos</button>
<div id="out"></div>
<script>
const $=s=>document.querySelector(s);
const DEF='https://conviteaf.github.io/Convite---Casamento/';
$('#base').value=location.protocol.startsWith('http')?location.origin+location.pathname.replace(/[^/]*$/,''):DEF;
try{$('#list').value=localStorage.getItem('lista')||''}catch(e){}
let all=[];
$('#go').onclick=()=>{
 const base=$('#base').value.trim().replace(/\/?$/,'/');all=[];$('#out').innerHTML='';
 try{localStorage.setItem('lista',$('#list').value)}catch(e){}
 for(const line of $('#list').value.split('\n')){
  const [name,seats,phone]=line.split(';').map(x=>(x||'').trim());if(!name)continue;
  const link=base+'?n='+encodeURIComponent(name)+(parseInt(seats)?'&l='+parseInt(seats):'');
  const msg=`Olá ${name}! Convidamo-vos para o casamento de Agnaldo e Fátima, a 31 de outubro de 2026. Abra o seu convite e confirme a presença aqui: ${link}`;
  all.push(name+' — '+link);
  const d=document.createElement('div');d.className='r';
  const b=document.createElement('b');b.textContent=name;d.append(b,document.createElement('br'));
  const s=document.createElement('small');s.textContent=link;d.append(s,document.createElement('br'));
  const w=document.createElement('a');w.className='b';w.target='_blank';w.rel='noopener';w.textContent='Enviar por WhatsApp';
  w.href='https://wa.me/'+phone.replace(/\D/g,'')+'?text='+encodeURIComponent(msg);d.append(w);
  const c=document.createElement('button');c.className='o';c.textContent='Copiar link';
  c.onclick=async()=>{try{await navigator.clipboard.writeText(link);c.textContent='Copiado'}catch(e){c.textContent='Copie à mão'}};d.append(c);
  $('#out').append(d)}
 if(!all.length)$('#out').textContent='Escreva pelo menos um nome.'};
$('#all').onclick=async()=>{try{await navigator.clipboard.writeText(all.join('\n'));$('#all').textContent='Copiado'}catch(e){}};
</script></body></html>
